server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Vite pone un hash en el nombre de estos ficheros, así que pueden cachearse sin límite.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El service worker y el manifest deben revalidarse siempre para que la PWA se actualice.
    location ~ ^/(sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
