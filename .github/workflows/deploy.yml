name: Deploy

# Cada push a main pasa las comprobaciones de CI, publica la imagen en GHCR y reinicia el servicio
# `frontend` en el servidor de producción (VM de Azure). La configuración de Compose y Caddy vive
# en el repositorio backend (deploy/), cuyo workflow debe haberse ejecutado al menos una vez. Solo
# despliega si el repositorio tiene la variable DEPLOY_HOST, así los forks nunca intentan
# conectarse al servidor.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  checks:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend checks
        run: npm run ci

  image:
    name: Build and push image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and push to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$image:latest" -t "$image:${GITHUB_SHA}" .
          docker push "$image:${GITHUB_SHA}"
          docker push "$image:latest"

  deploy:
    name: Deploy to production server
    needs: image
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Pull image and restart
        env:
          TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Login de GHCR propio de este repo (DOCKER_CONFIG): el Deploy del backend usa el mismo
          # usuario del servidor y, si los dos corren a la vez, un login sustituía al otro y el
          # pull fallaba con "denied".
          echo "$GHCR_TOKEN" | ssh "$TARGET" "DOCKER_CONFIG=\$HOME/.docker-ghcr-frontend docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          ssh "$TARGET" 'bash -s' <<'REMOTE'
          set -euo pipefail
          export DOCKER_CONFIG="$HOME/.docker-ghcr-frontend"
          cd /opt/weathermapz
          trap 'docker logout ghcr.io >/dev/null' EXIT
          if [ ! -f docker-compose.yml ]; then
            echo "Falta /opt/weathermapz/docker-compose.yml: despliega antes el backend." >&2
            exit 1
          fi
          docker compose pull frontend
          docker compose up -d frontend
          docker image prune -f
          REMOTE

      - name: Check site
        env:
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS -o /dev/null "https://$DEPLOY_DOMAIN/"; then exit 0; fi
            sleep 10
          done
          echo "El frontend no responde en https://$DEPLOY_DOMAIN/" >&2
          exit 1
